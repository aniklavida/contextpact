name: Bug report
description: Report reproducible incorrect behaviour.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Include the smallest safe reproduction without private context or secrets.
    validations:
      required: true
  - type: input
    attributes:
      label: ContextPact version
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system and Node.js version
    validations:
      required: true
