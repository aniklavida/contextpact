name: Feature request
description: Propose a user problem or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What workflow is blocked or unnecessarily difficult?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
