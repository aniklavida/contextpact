            [ "$name" = ".package-lock.json" ] && continue
            cp -R "$dep" "$NPM_HOME/node_modules/node-gyp/node_modules/$name"
          done
          BUNDLED="$NPM_HOME/node_modules/node-gyp/bin/node-gyp.js"
          ACTUAL="$(node "$BUNDLED" --version)"
